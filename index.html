<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array of Objects</title>
    <link rel="stylesheet" href="style.css">
    <style>
    </style>
</head>

<body>
<div class="card">
  <div class="img">
    <img src="https://media.istockphoto.com/id/1350560575/photo/pair-of-blue-running-sneakers-on-white-background-isolated.jpg?s=612x612&w=0&k=20&c=A3w_a9q3Gz-tWkQL6K00xu7UHdN5LLZefzPDp-wNkSU=" alt="Shoes">
  </div>
  <div class="product-description">
    <h3 class="title">Addidas Collection</h3>
    <p class="price">Rs 4999</p>
    <p>Comfortable everyday shoes with premium build quality</p>
    <button class="toggle-btn" onclick="showReviews()">Show reviews</button>
  </div>
  <div class="reviews">
    <div class="review">
      <p class="name">Babar Azam</p>
      <span class="comment">Behtareen Joote</span>
      <span class="rating">★★★★★</span>
    </div>
    <div class="review">
      <p class="name">Safeer Azam</p>
      <span class="comment">Alaa Joote</span>
      <span class="rating">★★★</span>
    </div>
    <button class="add-review" onclick="addReview()">Add review</button>
  </div>
</div>
 
    <script src="app.js"></script>
</body>

</html>
