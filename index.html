<!DOCTYPE html>
<html lang="en">

<head>

<body>
    <div class="card">
  <div class="card-img">
    <img src="https://media.istockphoto.com/id/1350560575/photo/pair-of-blue-running-sneakers-on-white-background-isolated.jpg?s=612x612&w=0&k=20&c=A3w_a9q3Gz-tWkQL6K00xu7UHdN5LLZefzPDp-wNkSU=" alt="Product">
  </div>

  <div class="card-body">
    <h3 class="title">Adidas Collection</h3>
    <p class="price">Rs 4,999</p>
    <p class="desc">
      Comfortable everyday shoes with premium build quality.
    </p>

    <button class="toggle-reviews" onclick="show()">Show reviews</button>
  </div>

  <div class="reviews ">
    <div class="review">
      <span class="name">Babar Azam</span>
      <p class="text">Behtareen joote</p>
    </div>

    <div class="review  review-2">
      <span class="name">Safeer Azam</span>
      <p class="text">Alaa joote</p>
    </div>

    <button class="add-review">Add review</button>
  </div>
</div>
